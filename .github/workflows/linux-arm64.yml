name: Build Linux ARM64

on:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: Build Mangayomi for Linux ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          echo "=== System ==="
          uname -a
          echo
          echo "=== CPU architecture ==="
          uname -m
          echo
          echo "=== Debian architecture ==="
          dpkg --print-architecture

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            unzip \
            zip \
            wget \
            file \
            webkit2gtk-4.1 \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            mpv \
            libmpv-dev \
            dpkg-dev \
            libblkid-dev \
            liblzma-dev \
            libjpeg-dev \
            libpng-dev \
            libavif-dev \
            libsecret-1-dev

      - name: Setup Flutter
        run: |
          git clone \
            https://github.com/flutter/flutter.git \
            --depth 1 \
            -b stable \
            "$HOME/flutter"

          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

          "$HOME/flutter/bin/flutter" --version

          "$HOME/flutter/bin/flutter" config --enable-linux-desktop

          "$HOME/flutter/bin/flutter" precache --linux

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify Rust
        run: |
          rustc --version
          cargo --version
          rustup show

      - name: Flutter pub get
        run: |
          flutter pub get

      - name: Build Mangayomi
        run: |
          flutter build linux --release --verbose

      - name: Verify build output
        run: |
          echo "=== Linux build directories ==="
          find build/linux -maxdepth 5 -type d -print

          echo
          echo "=== Mangayomi executables ==="
          find build/linux -type f -name mangayomi -exec file {} \;

      - name: Locate Linux ARM64 bundle
        id: bundle
        run: |
          set -e

          BUNDLE="build/linux/arm64/release/bundle"

          if [ ! -d "$BUNDLE" ]; then
            echo "ERROR: Linux ARM64 bundle directory was not found:"
            echo "$BUNDLE"
            exit 1
          fi

          if [ ! -f "$BUNDLE/mangayomi" ]; then
            echo "ERROR: Mangayomi executable was not found:"
            echo "$BUNDLE/mangayomi"
            exit 1
          fi

          echo "=== Bundle contents ==="
          ls -lah "$BUNDLE"

          echo
          echo "=== Mangayomi executable ==="
          file "$BUNDLE/mangayomi"

          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Verify ARM64 executable
        run: |
          BUNDLE="${{ steps.bundle.outputs.bundle_dir }}"

          echo "Checking executable:"
          echo "$BUNDLE/mangayomi"

          file "$BUNDLE/mangayomi"

      - name: Create ARM64 ZIP
        run: |
          set -e

          BUNDLE="${{ steps.bundle.outputs.bundle_dir }}"

          mkdir -p dist

          cd "$BUNDLE"

          zip -r \
            "$GITHUB_WORKSPACE/dist/Mangayomi-${GITHUB_SHA}-linux-arm64.zip" \
            .

      - name: Verify ZIP contents
        run: |
          echo "=== Artifact ==="
          ls -lh dist/

          echo
          echo "=== ZIP contents ==="
          unzip -l dist/*.zip | head -100

          echo
          echo "=== ZIP size ==="
          du -h dist/*.zip

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-linux-arm64
          path: dist/Mangayomi-*-linux-arm64.zip
          if-no-files-found: error
